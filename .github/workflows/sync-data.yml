name: Sync data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: kochi-buzz-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover public event pages
        id: discover_events
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DISCOVERY_MODEL: gpt-5.6-luna
          OPENAI_DISCOVERY_REFRESH_HOURS: "12"
          OPENAI_DISCOVERY_MAX_SEARCH_CALLS: "4"
          OPENAI_DISCOVERY_MAX_CANDIDATES: "20"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OpenAI discovery skipped: repository secret is not configured."
            exit 0
          fi
          npm run discover:events

      - name: Run data sync
        id: sync_data
        run: npx tsx scripts/sync/index.ts

      - name: Rank crowded calendar dates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CALENDAR_RANKING_MODEL: gpt-5.6-luna
        run: npm run rank:calendar

      - name: Run data tests
        run: npx vitest run

      - name: Commit data changes only
        run: |
          git add data/discovered data/generated data/state public/api/v1
          if git diff --cached --quiet; then
            echo "No data changes. Exiting."
            exit 0
          fi
          git config user.name "kochi-buzz-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh Kochi.buzz sources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Surface hard source failures
        if: steps.sync_data.outputs.failed != '0'
        run: |
          echo "${{ steps.sync_data.outputs.failed }} source adapter(s) failed. Preserved data was committed; failing the run for visibility."
          exit 1

  pipeline-health:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Keep one actionable pipeline health issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[automation] Data sync needs attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if ("${{ needs.sync.result }}" !== "success") {
              if (!existing) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: `The scheduled data pipeline failed. Existing source data was preserved.\n\n[Inspect this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
