name: Sync data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: kochi-buzz-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run data sync
        id: sync_data
        run: npx tsx scripts/sync/index.ts

      - name: Run data tests
        run: npx vitest run

      - name: Commit data changes only
        run: |
          git add data/generated data/state public/api/v1
          if git diff --cached --quiet; then
            echo "No data changes. Exiting."
            exit 0
          fi
          git config user.name "kochi-buzz-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh Kochi.buzz sources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Surface hard source failures
        if: steps.sync_data.outputs.failed != '0'
        run: |
          echo "${{ steps.sync_data.outputs.failed }} source adapter(s) failed. Preserved data was committed; failing the run for visibility."
          exit 1

  pipeline-health:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Keep one actionable pipeline health issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[automation] Data sync needs attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if ("${{ needs.sync.result }}" !== "success") {
              if (!existing) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: `The scheduled data pipeline failed. Existing source data was preserved.\n\n[Inspect this run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
